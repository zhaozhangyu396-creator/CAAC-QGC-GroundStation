name: Standalone Calculator

on:
  push:
    branches: [codex/caac-calculator-standalone]
    paths:
      - 'custom/tools/calculator/**'
      - 'custom/src/PlanView/CaacCalculatorMath.js'
      - '.github/workflows/calculator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: qt
      - name: Install Qt
        uses: ./.github/actions/qt-install
        with:
          version: '6.11.1'
          host: windows
          arch: win64_msvc2022_64
          archives: qtbase qtdeclarative
          aqt-source: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Configure
        run: |
          cmake -S custom/tools/calculator -B "$env:RUNNER_TEMP/calculator-build" -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
      - name: Build
        run: |
          cmake --build "$env:RUNNER_TEMP/calculator-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Package and verify
        run: |
          ./custom/tools/calculator/package-windows.ps1 -BuildDirectory "$env:RUNNER_TEMP/calculator-build" -QtRoot $env:QT_ROOT_DIR -OutputDirectory "$env:RUNNER_TEMP/calculator-delivery"
      - name: Upload calculator installer
        uses: actions/upload-artifact@v7
        with:
          name: FeihuCalculator-1.0.0-Windows-x64
          path: |
            ${{ runner.temp }}/calculator-delivery/FeihuCalculator-1.0.0-Windows-x64-Setup.exe
            ${{ runner.temp }}/calculator-delivery/CaacCalculator-1.0.0-source.zip
            ${{ runner.temp }}/calculator-delivery/SHA256SUMS.txt
            ${{ runner.temp }}/calculator-delivery/verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: calculator-verification
          path: |
            ${{ runner.temp }}/calculator-delivery/reports/**
            ${{ runner.temp }}/calculator-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 90
